<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAilG</title>
<style>
  :root {
    --bg:#fff; --bg-soft:#f7f7f8; --bg-sink:#f0f0f2; --fg:#16181d; --fg-dim:#6b7280;
    --border:#e5e7eb; --accent:#2563eb; --ok:#16a34a; --warn:#b45309; --warn-bg:#fffbeb;
    --danger:#dc2626; --radius:12px;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0f1115; --bg-soft:#171a21; --bg-sink:#12151b; --fg:#e6e8ec; --fg-dim:#9aa1ad;
    --border:#262b35; --accent:#6394f8; --ok:#4ade80; --warn:#fbbf24; --warn-bg:#2a2313;
    --danger:#f87171;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);height:100vh;display:flex;
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}

  /* 侧栏 */
  aside{width:260px;flex-shrink:0;background:var(--bg-sink);border-right:1px solid var(--border);
    display:flex;flex-direction:column}
  aside header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;
    align-items:center;gap:8px}
  aside header b{font-size:15px;letter-spacing:.04em}
  .newbtn{margin:12px 16px;padding:9px;border:1px dashed var(--border);border-radius:var(--radius);
    background:none;color:var(--fg);cursor:pointer;font:inherit;font-size:14px}
  .newbtn:hover{border-color:var(--accent);color:var(--accent)}
  .sessions{flex:1;overflow-y:auto;padding:0 8px 12px}
  .sess{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
  .sess:hover{background:var(--bg-soft)}
  .sess.on{background:var(--bg-soft);font-weight:600}
  .sess .x{margin-left:auto;opacity:0;color:var(--fg-dim);flex-shrink:0;padding:0 2px}
  .sess:hover .x{opacity:.7}
  .sess .x:hover{color:var(--danger);opacity:1}
  aside footer{padding:12px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--fg-dim)}
  aside footer a{color:inherit}

  /* 主区 */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  main{flex:1;overflow-y:auto}
  .wrap{max-width:760px;margin:0 auto;padding:24px 20px 40px}
  .empty{color:var(--fg-dim);text-align:center;padding:70px 20px}
  .empty code{background:var(--bg-soft);padding:2px 6px;border-radius:5px}

  .msg{margin-bottom:26px}
  .msg .role{font-size:12px;color:var(--fg-dim);margin-bottom:6px;font-weight:600}
  .bubble{white-space:pre-wrap;word-break:break-word}
  .msg.user .bubble{background:var(--bg-soft);padding:10px 14px;border-radius:var(--radius);
    display:inline-block;max-width:100%}
  .cite{color:var(--accent);font-weight:600}

  .sources{margin-top:12px;border-top:1px solid var(--border);padding-top:10px}
  .sources h4{font-size:12px;color:var(--fg-dim);margin:0 0 6px;font-weight:600}
  .src{font-size:13px;padding:4px 0;display:flex;gap:8px}
  .src .n{color:var(--accent);font-weight:600;flex-shrink:0}
  .src a{color:inherit;text-decoration:none;border-bottom:1px solid var(--border)}
  .src a:hover{border-color:var(--accent)}

  .warn{margin-top:10px;background:var(--warn-bg);border:1px solid var(--warn);
    border-radius:8px;padding:8px 12px;font-size:13px;color:var(--warn)}
  .trace{font-size:12px;color:var(--fg-dim);font-family:ui-monospace,Menlo,monospace;
    margin-bottom:8px;white-space:pre-wrap}

  .acts{margin-top:10px;display:flex;gap:6px;align-items:center}
  .act{background:none;border:1px solid var(--border);border-radius:7px;cursor:pointer;
    padding:3px 9px;font-size:13px;color:var(--fg-dim);font-family:inherit}
  .act:hover{border-color:var(--accent);color:var(--accent)}
  .act.done{border-color:var(--ok);color:var(--ok)}
  .act.down.done{border-color:var(--danger);color:var(--danger)}

  footer.composer{border-top:1px solid var(--border);padding:14px 20px}
  .row{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
  textarea{flex:1;resize:none;font:inherit;color:inherit;background:var(--bg-soft);
    border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;
    max-height:180px;min-height:44px}
  textarea:focus{outline:none;border-color:var(--accent)}
  button.send{font:inherit;font-weight:600;padding:0 20px;height:44px;border:none;
    border-radius:var(--radius);background:var(--accent);color:#fff;cursor:pointer}
  button.send:disabled{opacity:.45;cursor:default}
  .opts{max-width:760px;margin:8px auto 0;font-size:12px;color:var(--fg-dim);display:flex;gap:16px}
  .opts label{cursor:pointer;user-select:none}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#9ca3af;margin-right:5px}
  .dot.on{background:var(--ok)} .dot.off{background:var(--danger)}
  @media(max-width:720px){aside{display:none}}
</style>
</head>
<body>
<aside>
  <header><b>RAilG</b></header>
  <button class="newbtn" id="newSession">+ 新会话</button>
  <div class="sessions" id="sessions"></div>
  <footer>
    <div id="status"><span class="dot"></span>连接中…</div>
    <div style="margin-top:6px"><a href="/admin">管理台 →</a></div>
  </footer>
</aside>

<div class="main">
  <main><div class="wrap" id="feed">
    <div class="empty" id="empty">
      先把资料入库:<code>railg ingest ./docs</code><br>然后在下面提问。
    </div>
  </div></main>
  <footer class="composer">
    <div class="row">
      <textarea id="input" rows="1" placeholder="问点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="send" id="send">发送</button>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="rewrite" checked> 多轮查询改写</label>
      <label><input type="checkbox" id="showTrace"> 显示检索过程</label>
    </div>
  </footer>
</div>

<script>
const $ = id => document.getElementById(id);
const feed = $('feed'), input = $('input'), sendBtn = $('send');
let sessionId = null, busy = false;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cites = s => esc(s).replace(/\[(\d+(?:\s*[,，]\s*\d+)*)\]/g, m => `<span class="cite">${m}</span>`);
const scroll = () => { const m = document.querySelector('main'); m.scrollTop = m.scrollHeight; };

async function api(path, opts) {
  const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

// --- 会话 ---------------------------------------------------------------- //
async function loadSessions() {
  try {
    const { sessions } = await api('/api/sessions');
    $('sessions').innerHTML = sessions.map(s => `
      <div class="sess ${s.id === sessionId ? 'on' : ''}" data-id="${s.id}">
        <span style="overflow:hidden;text-overflow:ellipsis">${esc(s.title)}</span>
        <span class="x" data-del="${s.id}">×</span>
      </div>`).join('') || '<div style="padding:10px;color:var(--fg-dim);font-size:13px">还没有会话</div>';
  } catch {}
}

$('sessions').onclick = async e => {
  const del = e.target.dataset.del;
  if (del) {
    e.stopPropagation();
    await api('/api/sessions/' + del, { method: 'DELETE' });
    if (del === sessionId) { sessionId = null; feed.innerHTML = ''; }
    return loadSessions();
  }
  const row = e.target.closest('.sess');
  if (row) openSession(row.dataset.id);
};

$('newSession').onclick = () => {
  sessionId = null;
  feed.innerHTML = '<div class="empty">新会话，直接提问吧。</div>';
  loadSessions();
  input.focus();
};

async function openSession(id) {
  sessionId = id;
  feed.innerHTML = '';
  const { messages } = await api('/api/sessions/' + id);
  for (const m of messages) {
    const { box, bubble } = addMessage(m.role, '');
    bubble.innerHTML = m.role === 'assistant' ? cites(m.content) : esc(m.content);
    if (m.sources?.length) renderSources(box, m.sources);
    if (m.role === 'assistant') renderActions(box, m.id, m.content);
  }
  loadSessions();
  scroll();
}

// --- 渲染 ---------------------------------------------------------------- //
function addMessage(role, text) {
  $('empty')?.remove();
  const box = document.createElement('div');
  box.className = 'msg ' + role;
  box.innerHTML = `<div class="role">${role === 'user' ? '你' : 'RAilG'}</div>`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  box.appendChild(bubble);
  feed.appendChild(box);
  scroll();
  return { box, bubble };
}

function renderSources(box, sources) {
  if (!sources.length) return;
  const el = document.createElement('div');
  el.className = 'sources';
  el.innerHTML = '<h4>来源（仅列出回答中实际引用的）</h4>' + sources.map(s => {
    const label = esc(s.label || s.file_name);
    const link = s.file_url
      ? `<a href="${esc(s.file_url)}" target="_blank" rel="noopener">${label}</a>` : label;
    return `<div class="src"><span class="n">[${s.n}]</span><span>${link}</span></div>`;
  }).join('');
  box.appendChild(el);
}

function renderActions(box, messageId, answer) {
  if (!messageId) return;
  const el = document.createElement('div');
  el.className = 'acts';
  el.innerHTML = `<button class="act up">👍 有帮助</button>
                  <button class="act down">👎 没帮助</button>`;
  box.appendChild(el);

  el.querySelectorAll('.act').forEach(btn => {
    btn.onclick = async () => {
      const rating = btn.classList.contains('up') ? 'up' : 'down';
      let comment = '';
      if (rating === 'down') comment = prompt('哪里不对？（可留空）') ?? '';
      try {
        await api('/api/feedback', {
          method: 'POST',
          body: JSON.stringify({
            message_id: messageId, session_id: sessionId, rating, comment,
            query: box.previousElementSibling?.querySelector('.bubble')?.textContent || '',
            answer,
          }),
        });
        el.querySelectorAll('.act').forEach(b => { b.classList.remove('done'); b.disabled = true; });
        btn.classList.add('done');
        btn.textContent = rating === 'up' ? '👍 已记录' : '👎 已记录';
      } catch { btn.textContent = '提交失败'; }
    };
  });
}

// --- 发送 ---------------------------------------------------------------- //
async function send() {
  const query = input.value.trim();
  if (!query || busy) return;
  busy = true; sendBtn.disabled = true;
  input.value = ''; input.style.height = 'auto';

  addMessage('user', query);
  const { box, bubble } = addMessage('assistant', '');
  let answer = '', messageId = null;

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, session_id: sessionId, rewrite: $('rewrite').checked }),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);

    const reader = resp.body.getReader(), decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split('\n\n');
      buffer = parts.pop();
      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data:')) continue;
        let ev; try { ev = JSON.parse(line.slice(5).trim()); } catch { continue; }

        if (ev.type === 'session') {
          sessionId = ev.session_id;
          if (ev.created) loadSessions();
        } else if (ev.type === 'delta') {
          answer += ev.text; bubble.innerHTML = cites(answer); scroll();
        } else if (ev.type === 'trace' && $('showTrace').checked) {
          const t = ev.data, el = document.createElement('div');
          el.className = 'trace';
          el.textContent = `召回 ${t.n_raw} → 重排 ${t.n_reranked} → 父块 ${t.n_parents}`
            + ` · 上下文 ${t.context_tokens} token · ${JSON.stringify(t.timings_ms)}`
            + (t.rewritten_query !== t.original_query ? `\n改写: ${t.rewritten_query}` : '');
          box.insertBefore(el, bubble);
        } else if (ev.type === 'sources') {
          renderSources(box, ev.data);
        } else if (ev.type === 'warning' && ev.data.length) {
          const el = document.createElement('div');
          el.className = 'warn';
          el.textContent = `以下 ${ev.data.length} 句引用支撑不足，请核对原文：`
            + ev.data.map(w => `「${w.sentence.slice(0, 40)}…」`).join(' ');
          box.appendChild(el);
        } else if (ev.type === 'message') {
          messageId = ev.message_id;
          renderActions(box, messageId, answer);
        } else if (ev.type === 'error') {
          bubble.textContent = answer + '\n\n[出错] ' + ev.message;
        }
      }
    }
  } catch (err) {
    bubble.textContent = answer + '\n\n[请求失败] ' + err.message;
  } finally {
    busy = false; sendBtn.disabled = false; input.focus();
    loadSessions();
  }
}

sendBtn.onclick = send;
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 180) + 'px';
});

(async () => {
  try {
    const [h, s] = await Promise.all([api('/api/health'), api('/api/stats')]);
    const corpus = s.index?.n_docs ? `${s.index.n_docs} 篇 / ${s.index.n_chunks} 块` : '索引为空';
    $('status').innerHTML = `<span class="dot ${h.ok ? 'on' : 'off'}"></span>${corpus}`;
  } catch {
    $('status').innerHTML = '<span class="dot off"></span>服务未就绪';
  }
  loadSessions();
})();
input.focus();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAilG 管理台</title>
<style>
  :root{--bg:#fff;--bg-soft:#f7f7f8;--fg:#16181d;--fg-dim:#6b7280;--border:#e5e7eb;
    --accent:#2563eb;--ok:#16a34a;--warn:#b45309;--danger:#dc2626;--radius:10px}
  @media(prefers-color-scheme:dark){:root{--bg:#0f1115;--bg-soft:#171a21;--fg:#e6e8ec;
    --fg-dim:#9aa1ad;--border:#262b35;--accent:#6394f8;--ok:#4ade80;--warn:#fbbf24;--danger:#f87171}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:center;gap:20px;padding:14px 24px;border-bottom:1px solid var(--border)}
  header b{letter-spacing:.04em}
  nav{display:flex;gap:4px;margin-left:auto}
  nav button{background:none;border:1px solid transparent;border-radius:8px;padding:6px 14px;
    cursor:pointer;font:inherit;font-size:14px;color:var(--fg-dim)}
  nav button:hover{background:var(--bg-soft);color:var(--fg)}
  nav button.on{background:var(--bg-soft);color:var(--fg);font-weight:600;border-color:var(--border)}
  nav a{color:var(--fg-dim);text-decoration:none;padding:6px 14px;font-size:14px}
  main{max-width:1100px;margin:0 auto;padding:24px}
  .panel{display:none} .panel.on{display:block}
  h2{font-size:16px;margin:0 0 4px} .sub{color:var(--fg-dim);font-size:13px;margin-bottom:16px}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px}
  .card{background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
  .card .k{font-size:12px;color:var(--fg-dim)} .card .v{font-size:24px;font-weight:600;margin-top:2px}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--fg-dim);padding:8px;border-bottom:1px solid var(--border);font-weight:600}
  td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
  tr:hover td{background:var(--bg-soft)}
  .scroll{overflow-x:auto}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--fg-dim)}
  .ok{color:var(--ok)} .bad{color:var(--danger)} .warnc{color:var(--warn)}

  button.act{background:none;border:1px solid var(--border);border-radius:7px;padding:3px 9px;
    cursor:pointer;font:inherit;font-size:12px;color:var(--fg-dim);margin-right:4px}
  button.act:hover{border-color:var(--accent);color:var(--accent)}
  button.act.danger:hover{border-color:var(--danger);color:var(--danger)}
  button.primary{background:var(--accent);color:#fff;border:none;border-radius:8px;
    padding:8px 16px;cursor:pointer;font:inherit;font-weight:600;font-size:14px}
  button.primary:disabled{opacity:.5;cursor:default}
  input,select{font:inherit;font-size:14px;background:var(--bg-soft);color:inherit;
    border:1px solid var(--border);border-radius:8px;padding:7px 11px}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  .bar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .empty{color:var(--fg-dim);padding:40px;text-align:center}
  pre{background:var(--bg-soft);border:1px solid var(--border);border-radius:8px;
    padding:12px;overflow-x:auto;font-size:12px}
</style>
</head>
<body>
<header>
  <b>RAilG 管理台</b>
  <nav>
    <button data-tab="docs" class="on">文档</button>
    <button data-tab="eval">评测</button>
    <button data-tab="feedback">反馈</button>
    <button data-tab="metrics">指标</button>
    <a href="/">← 回到聊天</a>
  </nav>
</header>

<main>
  <!-- 文档 -->
  <section class="panel on" id="p-docs">
    <h2>文档</h2>
    <div class="sub">OpenSearch 里存的是 chunk，这里是文档这一层，支持删除与重建索引。</div>
    <div class="cards" id="docCards"></div>
    <div class="bar">
      <input id="docPath" placeholder="本地路径，如 ./docs" style="flex:1;min-width:220px">
      <button class="primary" id="btnIngest">入库</button>
      <input id="docUrl" placeholder="或粘一个 URL" style="flex:1;min-width:220px">
      <button class="primary" id="btnIngestUrl">抓取</button>
    </div>
    <div class="bar">
      <input id="docSearch" placeholder="按文件名筛选…" style="flex:1">
    </div>
    <div id="ingestOut"></div>
    <div class="scroll"><table>
      <thead><tr><th>文件</th><th>类型</th><th>块数</th><th>来源</th><th>状态</th><th>时间</th><th></th></tr></thead>
      <tbody id="docRows"></tbody>
    </table></div>
  </section>

  <!-- 评测 -->
  <section class="panel" id="p-eval">
    <h2>检索评测</h2>
    <div class="sub">
      没有基线就没法判断调参是变好还是变坏。先攒 30~50 条 case，每次改参数跑一遍对比。
    </div>
    <div class="bar">
      <input id="evalQuery" placeholder="问题" style="flex:2;min-width:200px">
      <input id="evalDocs" placeholder="期望命中的文件名，逗号分隔" style="flex:2;min-width:200px">
      <button class="primary" id="btnAddCase">加 case</button>
    </div>
    <div class="bar">
      <input id="evalLabel" placeholder="本次跑分的标签，如 baseline">
      <input id="evalCompare" placeholder="与哪个标签对比（可留空）">
      <button class="primary" id="btnRunEval">跑评测</button>
    </div>
    <div id="evalOut"></div>
    <h2 style="margin-top:24px">评测集</h2>
    <div class="scroll"><table>
      <thead><tr><th>问题</th><th>期望命中</th><th></th></tr></thead>
      <tbody id="caseRows"></tbody>
    </table></div>
    <h2 style="margin-top:24px">历史跑分</h2>
    <div class="scroll"><table>
      <thead><tr><th>标签</th><th>条数</th><th>recall@5</th><th>ndcg@10</th><th>MRR</th><th>时间</th></tr></thead>
      <tbody id="runRows"></tbody>
    </table></div>
  </section>

  <!-- 反馈 -->
  <section class="panel" id="p-feedback">
    <h2>用户反馈</h2>
    <div class="sub">被点「没帮助」的问题，就是下一批评测 case 的来源。</div>
    <div class="cards" id="fbCards"></div>
    <div class="bar">
      <select id="fbFilter">
        <option value="">全部</option><option value="down">只看 👎</option><option value="up">只看 👍</option>
      </select>
    </div>
    <div class="scroll"><table>
      <thead><tr><th></th><th>问题</th><th>备注</th><th>时间</th></tr></thead>
      <tbody id="fbRows"></tbody>
    </table></div>
  </section>

  <!-- 指标 -->
  <section class="panel" id="p-metrics">
    <h2>运行指标</h2>
    <div class="sub">近 24 小时的问答请求。</div>
    <div class="cards" id="mtCards"></div>
    <h2 style="margin-top:24px">当前配置</h2>
    <pre id="healthOut">加载中…</pre>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ts = v => new Date(v * 1000).toLocaleString('zh-CN', {hour12: false});

async function api(path, opts) {
  const r = await fetch(path, { headers: {'Content-Type':'application/json'}, ...opts });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || ('HTTP ' + r.status));
  return body;
}
const cards = (el, items) => el.innerHTML = items
  .map(([k, v]) => `<div class="card"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('');

// --- tabs --- //
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'p-' + b.dataset.tab));
  ({docs: loadDocs, eval: loadEval, feedback: loadFeedback, metrics: loadMetrics})[b.dataset.tab]();
});

// --- 文档 --- //
async function loadDocs() {
  const kw = $('docSearch').value.trim();
  const { stats, documents } = await api('/api/documents?keyword=' + encodeURIComponent(kw));
  cards($('docCards'), [['文档', stats.n_docs], ['块', stats.n_chunks], ['失败', stats.n_failed]]);
  $('docRows').innerHTML = documents.length ? documents.map(d => `
    <tr>
      <td>${esc(d.file_name)}<div class="mono">${esc(d.doc_id)}</div></td>
      <td>${esc(d.document_type)}</td><td>${d.n_chunks}</td><td>${esc(d.source_kind)}</td>
      <td class="${d.status === 'indexed' ? 'ok' : 'bad'}">${esc(d.status)}
        ${d.error ? `<div class="mono bad">${esc(d.error.slice(0,80))}</div>` : ''}</td>
      <td class="mono">${ts(d.indexed_at)}</td>
      <td style="white-space:nowrap">
        <button class="act" data-re="${d.doc_id}">重建</button>
        <button class="act danger" data-del="${d.doc_id}">删除</button>
      </td>
    </tr>`).join('') : '<tr><td colspan="7" class="empty">还没有文档</td></tr>';
}
$('docSearch').oninput = () => { clearTimeout(window._t); window._t = setTimeout(loadDocs, 300); };
$('docRows').onclick = async e => {
  const del = e.target.dataset.del, re = e.target.dataset.re;
  if (del && confirm('删除这个文档及其全部索引块？')) {
    await api('/api/documents/' + del, { method: 'DELETE' }); loadDocs();
  } else if (re) {
    e.target.textContent = '…';
    try { await api(`/api/documents/${re}/reindex`, { method: 'POST' }); }
    catch (err) { alert(err.message); }
    loadDocs();
  }
};
$('btnIngest').onclick = async () => {
  const path = $('docPath').value.trim(); if (!path) return;
  $('btnIngest').disabled = true; $('ingestOut').innerHTML = '<div class="sub">入库中…</div>';
  try {
    const r = await api('/api/ingest', { method: 'POST', body: JSON.stringify({ path }) });
    $('ingestOut').innerHTML = `<div class="sub ok">入库 ${r.indexed} / 跳过 ${r.skipped} / 失败 ${r.failed}，共 ${r.total_chunks} 块</div>`;
  } catch (err) { $('ingestOut').innerHTML = `<div class="sub bad">${esc(err.message)}</div>`; }
  $('btnIngest').disabled = false; loadDocs();
};
$('btnIngestUrl').onclick = async () => {
  const url = $('docUrl').value.trim(); if (!url) return;
  $('btnIngestUrl').disabled = true; $('ingestOut').innerHTML = '<div class="sub">抓取中…</div>';
  try {
    const r = await api('/api/ingest/urls', { method: 'POST', body: JSON.stringify({ urls: [url] }) });
    $('ingestOut').innerHTML = `<div class="sub ok">入库 ${r.indexed} / 失败 ${r.failed}，共 ${r.total_chunks} 块</div>`;
  } catch (err) { $('ingestOut').innerHTML = `<div class="sub bad">${esc(err.message)}</div>`; }
  $('btnIngestUrl').disabled = false; loadDocs();
};

// --- 评测 --- //
async function loadEval() {
  const [{ cases }, { runs }] = await Promise.all([api('/api/eval/cases'), api('/api/eval/runs')]);
  $('caseRows').innerHTML = cases.length ? cases.map(c => `
    <tr><td>${esc(c.query)}</td><td class="mono">${esc(c.expected_docs.join(', ') || '(未标注)')}</td>
    <td><button class="act danger" data-case="${c.id}">删除</button></td></tr>`).join('')
    : '<tr><td colspan="3" class="empty">评测集是空的</td></tr>';
  $('runRows').innerHTML = runs.length ? runs.map(r => `
    <tr><td><b>${esc(r.label || '(无标签)')}</b><div class="mono">${esc(r.id)}</div></td>
    <td>${r.n_cases}</td><td>${(r.metrics['recall@5'] ?? 0).toFixed(3)}</td>
    <td>${(r.metrics['ndcg@10'] ?? 0).toFixed(3)}</td><td>${(r.metrics.mrr ?? 0).toFixed(3)}</td>
    <td class="mono">${ts(r.created_at)}</td></tr>`).join('')
    : '<tr><td colspan="6" class="empty">还没跑过</td></tr>';
}
$('caseRows').onclick = async e => {
  const id = e.target.dataset.case;
  if (id) { await api('/api/eval/cases/' + id, { method: 'DELETE' }); loadEval(); }
};
$('btnAddCase').onclick = async () => {
  const query = $('evalQuery').value.trim(); if (!query) return;
  const docs = $('evalDocs').value.split(',').map(s => s.trim()).filter(Boolean);
  await api('/api/eval/cases', { method: 'POST', body: JSON.stringify({ query, expected_docs: docs }) });
  $('evalQuery').value = ''; $('evalDocs').value = ''; loadEval();
};
$('btnRunEval').onclick = async () => {
  $('btnRunEval').disabled = true;
  $('evalOut').innerHTML = '<div class="sub">跑评测中，每条 case 都要走一次完整检索…</div>';
  try {
    const r = await api('/api/eval/run', { method: 'POST', body: JSON.stringify({
      label: $('evalLabel').value.trim(), compare_with: $('evalCompare').value.trim() }) });
    let html = `<div class="cards">` + Object.entries(r.metrics)
      .filter(([k]) => ['recall@1','recall@5','ndcg@10','mrr'].includes(k))
      .map(([k, v]) => `<div class="card"><div class="k">${k}</div><div class="v">${v.toFixed(3)}</div></div>`)
      .join('') + `</div><div class="sub">${r.n_cases} 条 case</div>`;
    if (r.comparison) {
      html += `<h2>与 ${esc(r.comparison.baseline_label)} 对比</h2><div class="scroll"><table>
        <thead><tr><th>指标</th><th>之前</th><th>现在</th><th>变化</th></tr></thead><tbody>` +
        Object.entries(r.comparison.diff).filter(([k]) => k.includes('@') || k === 'mrr')
        .map(([k, d]) => `<tr><td>${k}</td><td>${d.before.toFixed(4)}</td><td>${d.after.toFixed(4)}</td>
          <td class="${d.regressed ? 'bad' : 'ok'}">${d.delta >= 0 ? '+' : ''}${d.delta.toFixed(4)}</td></tr>`)
        .join('') + '</tbody></table></div>';
    }
    if (r.worst?.length) {
      html += '<h2 style="margin-top:20px">最差的几条</h2><div class="scroll"><table>' +
        '<thead><tr><th>问题</th><th>recall@5</th><th>期望 / 召回</th></tr></thead><tbody>' +
        r.worst.map(c => `<tr><td>${esc(c.query)}</td>
          <td class="${(c.metrics['recall@5'] ?? 0) > 0 ? '' : 'bad'}">${(c.metrics['recall@5'] ?? 0).toFixed(2)}</td>
          <td class="mono">${esc(c.expected.join(', '))} / ${esc(c.retrieved.slice(0,3).join(', '))}</td>
        </tr>`).join('') + '</tbody></table></div>';
    }
    $('evalOut').innerHTML = html;
  } catch (err) { $('evalOut').innerHTML = `<div class="sub bad">${esc(err.message)}</div>`; }
  $('btnRunEval').disabled = false; loadEval();
};

// --- 反馈 --- //
async function loadFeedback() {
  const q = $('fbFilter').value ? '?rating=' + $('fbFilter').value : '';
  const { summary, items } = await api('/api/feedback' + q);
  cards($('fbCards'), [['👍 有帮助', summary.up], ['👎 没帮助', summary.down]]);
  $('fbRows').innerHTML = items.length ? items.map(f => `
    <tr><td>${f.rating === 'up' ? '👍' : '👎'}</td><td>${esc(f.query)}</td>
    <td class="warnc">${esc(f.comment)}</td><td class="mono">${ts(f.created_at)}</td></tr>`).join('')
    : '<tr><td colspan="4" class="empty">还没有反馈</td></tr>';
}
$('fbFilter').onchange = loadFeedback;

// --- 指标 --- //
async function loadMetrics() {
  const [m, h] = await Promise.all([api('/api/metrics'), api('/api/health')]);
  cards($('mtCards'), [
    ['请求数', m.requests], ['平均延迟', m.avg_latency_ms + ' ms'],
    ['最大延迟', m.max_latency_ms + ' ms'], ['错误率', (m.error_rate * 100).toFixed(1) + '%'],
  ]);
  $('healthOut').textContent = JSON.stringify(h, null, 2);
}

loadDocs();
</script>
</body>
</html>

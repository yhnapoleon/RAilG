[project]
name = "railg"
version = "0.2.0"
description = "RAilG —— 从数据索引到用户端 chatbot 的端到端 RAG 流水线"
requires-python = ">=3.10"

dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    # config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    # store —— async 客户端需要 [async] extra(它会带上 aiohttp)
    "opensearch-py[async]>=2.6",
    # http
    "httpx>=0.27",
    "tenacity>=8.3",
    # chunking (核心算法依赖)
    "langchain-text-splitters>=0.2",
    "rapidfuzz>=3.9",
    "mistletoe>=1.4",
    # extractors
    "pypdf>=4.2",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
]

[project.optional-dependencies]
# 精确 token 计数(不装则用启发式估算,对云 API 场景足够)
tokenizer = ["tiktoken>=0.7"]
# 预留:本地 OCR。pymupdf 用于把 PDF 页渲染成图像(OCR/VLM 都需要)
ocr = ["pymupdf>=1.24", "paddleocr>=2.8", "paddlepaddle>=2.6", "pillow>=10.3"]
# 只想用 VLM(云端多模态)而不装 paddle 时,装这个就够
vlm = ["pymupdf>=1.24", "pillow>=10.3"]
# 预留:本地模型
local = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
railg = "railg.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["railg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 用项目内的临时目录:系统 temp 在部分 Windows 环境下会因残留目录权限失败,
# 放在项目内也让 CI 的行为和本地一致
addopts = "--basetemp=.pytest-tmp"

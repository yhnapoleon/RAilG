# 完整栈:OpenSearch + RAilG 应用。模型全部走云 API,所以没有 GPU 服务。
#
#   docker compose up -d                 起 OpenSearch + 应用  → http://localhost:8000
#   docker compose up -d opensearch      只起 OpenSearch(本地开发应用时用)
#   docker compose --profile ui up -d    附带 Dashboards(调试 ES 查询用)
#
# 应用需要 API key:把 RAILG_API_KEY 写进 .env,compose 会自动读取。

services:
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: railg-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      # 轻量:1g 堆足够百万级 chunk
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      # 个人项目关掉安全插件,省掉证书和账号配置。
      # 要暴露到公网,请务必改回 false 并配置 TLS + 账号。
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  railg:
    build: .
    container_name: railg-app
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      # 容器内要指向服务名,不是 localhost
      - RAILG__STORE__URL=http://opensearch:9200
      - RAILG_API_KEY=${RAILG_API_KEY:-}
      - RAILG_EMBEDDING_API_KEY=${RAILG_EMBEDDING_API_KEY:-}
      - RAILG_RERANK_API_KEY=${RAILG_RERANK_API_KEY:-}
      - RAILG_LLM_API_KEY=${RAILG_LLM_API_KEY:-}
      - RAILG_ADMIN_PASSWORD=${RAILG_ADMIN_PASSWORD:-}
      - RAILG_JWT_SECRET=${RAILG_JWT_SECRET:-}
    volumes:
      # 会话/反馈/评测集持久化
      - railg-data:/app/data
      # 要入库的资料:把宿主机目录挂进来,然后在管理台填 /corpus
      - ./corpus:/corpus:ro
    ports:
      - "8000:8000"
    restart: unless-stopped

  dashboards:
    image: opensearchproject/opensearch-dashboards:2.17.1
    container_name: railg-dashboards
    profiles: ["ui"]
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  opensearch-data:
  railg-data:
